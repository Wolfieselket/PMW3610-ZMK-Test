
# Enable pointing device support
CONFIG_ZMK_POINTING=y

# Enable PMW3610 sensor driver
CONFIG_PMW3610_ALT=y

# Enable SPI
CONFIG_SPI=y

# Enable input subsystem
CONFIG_INPUT=y

# Enable USB support
CONFIG_ZMK_USB=y

# Logging for troubleshooting
CONFIG_LOG=y

# More detailed diagnostic logging
CONFIG_LOG_DEFAULT_LEVEL=4

