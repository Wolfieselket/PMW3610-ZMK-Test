
# Enable pointing device support
CONFIG_ZMK_POINTING=y

# Enable PMW3610 sensor driver
CONFIG_PMW3610_ALT=y

# Enable SPI
CONFIG_SPI=y

# Enable input subsystem
CONFIG_INPUT=y

# Enable USB support
CONFIG_ZMK_USB=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# PMW3610-specific diagnostics
CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y

# Allow sensor power to stabilize before initialization
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# Enable the existing wolfie-niceview status screen on the integrated build.
# The wolfie_niceview shield supplies display inversion and monochrome settings.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_ZMK_DISPLAY_INVERT=y
